# Added to /etc/strongswan.d/ and included from Ubuntu's strongswan.conf.
charon {
  # BIRD owns the kernel routes. XFRM interfaces are pre-created by xfrm.sh.
  # Avoid strongSwan installing broad 0.0.0.0/0 routes that capture IKE traffic.
  install_routes = no

  # Send useful daemon events to `docker compose logs` without debug-level
  # exchange dumps that may be sensitive or noisy.
  filelog {
    stdout {
      path = stdout
      default = 1
      ike_name = yes
      flush_line = yes
    }
  }
}
